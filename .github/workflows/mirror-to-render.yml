name: Mirror to BulosBackendServer (Render)

on:
  push:
    branches:
      - main

jobs:
  mirror:
    name: Push to TwN1028/BulosBackendServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to BulosBackendServer
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "ERROR: MIRROR_PAT secret is not set or is empty"
            exit 1
          fi
          git remote add render "https://x-access-token:${MIRROR_PAT}@github.com/TwN1028/BulosBackendServer.git"
          git push render main --force
